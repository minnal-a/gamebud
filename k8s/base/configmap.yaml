# Non-secret configuration shared by the backend and Postgres.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gamebuddy-config
  namespace: gamebuddy
  labels:
    app.kubernetes.io/part-of: gamebuddy
data:
  POSTGRES_DB: gamebuddy
  POSTGRES_USER: gamebuddy
  DATABASE_HOST: postgres
  DATABASE_SSL: "false"
  NODE_ENV: production
  PORT: "3001"
  CHAT_PORT: "4000"
  # URLs as seen from the browser. With port-forwarding (see k8s/README.md)
  # these are localhost; the ingress phase replaces them.
  API_URL: http://localhost:3001
  FRONTEND_URL: http://localhost:3000
